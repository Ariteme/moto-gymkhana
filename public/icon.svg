<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background -->
  <rect width="100" height="100" rx="16" fill="white"/>

  <!-- Magen David (Star of David) — two overlapping triangles, blue -->
  <polygon points="50,8 87,68 13,68" fill="none" stroke="#0038A8" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="50,92 87,32 13,32" fill="none" stroke="#0038A8" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Leaning motorcycle inside the star -->
  <!-- Rear wheel -->
  <circle cx="33" cy="62" r="8" fill="none" stroke="#0038A8" stroke-width="2.5"/>
  <circle cx="33" cy="62" r="2" fill="#0038A8"/>
  <!-- Front wheel (slightly higher = lean effect) -->
  <circle cx="67" cy="59" r="8" fill="none" stroke="#0038A8" stroke-width="2.5"/>
  <circle cx="67" cy="59" r="2" fill="#0038A8"/>
  <!-- Frame -->
  <path d="M33,54 L42,42 L59,39 L67,51" fill="none" stroke="#0038A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Seat -->
  <line x1="40" y1="44" x2="58" y2="40" stroke="#0038A8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Front fork -->
  <line x1="62" y1="40" x2="67" y2="51" stroke="#0038A8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Two traffic cones at the bottom of the star -->
  <polygon points="41,77 44.5,70 48,77" fill="#0038A8"/>
  <polygon points="52,77 55.5,70 59,77" fill="#0038A8"/>
</svg>
